name: production-health

# Post-deploy smoke check against the deployed Production site. Runs after
# every push to main; the script's --wait-deploy flag polls the live homepage
# (bounded: 4-minute ceiling) so it does not race the asynchronous Vercel
# deployment. Code correctness is covered by the existing CI workflow — this
# job only verifies that Production actually serves the expected responses.
#
# The check is unauthenticated and read-only: it asserts public pages/data
# are reachable and that admin/payment APIs reject anonymous calls. It never
# signs in, writes data, or sends real webhook/checkout payloads.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The health script imports shared helpers from src/lib/*.ts, which
      # plain Node runs via native type stripping — Node 24 (same as CI).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run post-deploy production health check
        run: node scripts/production-health.mjs --wait-deploy
        env:
          PRODUCTION_BASE_URL: https://audiorepeat.vercel.app
